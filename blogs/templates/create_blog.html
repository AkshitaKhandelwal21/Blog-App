<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Entry — Write a Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EAE7DD;
    --paper-line: #D9D4C4;
    --ink: #202A3B;
    --ink-soft: #4B5568;
    --rule-red: #9C3B3B;
    --accent: #2F6F62;
    --accent-soft: #E4EFE9;
    --gutter: 72px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: #C9C4B6;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }

  body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  .sheet{
    position: relative;
    width: 100%;
    max-width: 760px;
    background: var(--paper);
    box-shadow: 0 30px 60px rgba(0,0,0,0.25), 0 2px 0 rgba(255,255,255,0.4) inset;
    border-radius: 2px;
    padding: 56px 48px 40px calc(var(--gutter) + 24px);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 34px;
    background-position: 0 220px;
  }

  .margin-rule{
    position: absolute;
    top: 0;
    bottom: 0;
    left: var(--gutter);
    width: 2px;
    background: var(--rule-red);
    opacity: 0.55;
  }

  .punch{
    position: absolute;
    left: 26px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #C9C4B6;
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.25);
  }
  .punch.p1{ top: 64px; }
  .punch.p2{ top: 50%; margin-top: -7px; }
  .punch.p3{ bottom: 64px; }

  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px 0;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.15;
    margin: 0 0 4px 0;
    color: var(--ink);
  }

  .subhead{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 36px 0;
  }

  form{
    position: relative;
  }

  label{
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .field{
    margin-bottom: 30px;
  }

  input[type="text"]{
    width: 100%;
    border: none;
    background: transparent;
    border-bottom: 1px solid var(--ink);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 26px;
    color: var(--ink);
    padding: 4px 2px 10px 2px;
    outline: none;
  }

  input[type="text"]::placeholder{
    color: #9A9585;
    opacity: 1;
  }

  input[type="text"]:focus{
    border-bottom: 1px solid var(--accent);
  }

  textarea{
    width: 100%;
    min-height: 300px;
    resize: vertical;
    border: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    line-height: 34px;
    color: var(--ink);
    outline: none;
    padding: 0 2px;
  }

  textarea::placeholder{
    color: #9A9585;
  }

  .byline{
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 38px;
  }

  .byline .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  .status-bar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px dashed var(--paper-line);
  }

  .counter{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }

  .counter strong{
    color: var(--ink);
    font-weight: 500;
  }

  .actions{
    display: flex;
    gap: 12px;
  }

  button{
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 12px 22px;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  button:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn-primary{
    background: var(--accent);
    color: #F5F3EC;
  }

  .btn-primary:hover{
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(47,111,98,0.35);
  }

  .btn-ghost{
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--paper-line);
  }

  .btn-ghost:hover{
    color: var(--ink);
    border-color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce){
    button{ transition: none; }
  }

  @media (max-width: 600px){
    :root{ --gutter: 40px; }
    .sheet{
      padding: 44px 24px 32px calc(var(--gutter) + 18px);
    }
    h1{ font-size: 27px; }
    input[type="text"]{ font-size: 21px; }
    .status-bar{ flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

  <div class="sheet">
    <div class="margin-rule"></div>
    <div class="punch p1"></div>
    <div class="punch p2"></div>
    <div class="punch p3"></div>

    <p class="eyebrow">New Entry</p>
    <h1>Write your blog</h1>
    <p class="subhead">Draft it here. It saves nothing until you publish.</p>

    <form id="blogForm" method="POST" action="#">
    {% csrf_token %}
      <div class="field">
        <label for="title">Title</label>
        {{form.title}}
      </div>

      <div class="byline">
        <span class="dot"></span>
        <span>Posting as You — draft started just now</span>
      </div>

      <div class="field">
        <label for="content">Content</label>
        {{form.content}}
      </div>

      <div class="status-bar">
        <div class="counter"><strong id="wordCount">0</strong> words · <strong id="readTime">0</strong> min read</div>
        <div class="actions">
          <button type="button" class="btn-ghost" onclick="document.getElementById('blogForm').reset(); updateCounts();">Discard</button>
          <button type="submit" class="btn-primary">Publish</button>
        </div>
      </div>

    </form>
  </div>

</body>
</html>
