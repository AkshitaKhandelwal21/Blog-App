<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — All Entries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EAE7DD;
    --paper-line: #D9D4C4;
    --ink: #202A3B;
    --ink-soft: #4B5568;
    --rule-red: #9C3B3B;
    --accent: #2F6F62;
    --accent-soft: #E4EFE9;
    --gutter: 72px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: #C9C4B6;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }

  body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  .sheet{
    position: relative;
    width: 100%;
    max-width: 760px;
    background: var(--paper);
    box-shadow: 0 30px 60px rgba(0,0,0,0.25), 0 2px 0 rgba(255,255,255,0.4) inset;
    border-radius: 2px;
    padding: 56px 48px 56px calc(var(--gutter) + 24px);
  }

  .margin-rule{
    position: absolute;
    top: 0;
    bottom: 0;
    left: var(--gutter);
    width: 2px;
    background: var(--rule-red);
    opacity: 0.55;
  }

  .punch{
    position: absolute;
    left: 26px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #C9C4B6;
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.25);
  }
  .punch.p1{ top: 64px; }
  .punch.p2{ top: 50%; margin-top: -7px; }
  .punch.p3{ bottom: 64px; }

  .page-head{
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px 0;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.15;
    margin: 0 0 4px 0;
    color: var(--ink);
  }

  .subhead{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0;
  }

  .new-entry{
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    background: var(--accent);
    color: #F5F3EC;
    padding: 12px 20px;
    border-radius: 3px;
    white-space: nowrap;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .new-entry:hover{
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(47,111,98,0.35);
  }

  .new-entry:focus-visible{
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  .index-count{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    margin: 0 0 20px 0;
    padding-bottom: 14px;
    border-bottom: 1px dashed var(--paper-line);
  }

  ul.entries{
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .entry{
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 18px;
    padding: 26px 0;
    border-bottom: 1px solid var(--paper-line);
  }

  .entry:first-child{
    padding-top: 0;
  }

  .entry:last-child{
    border-bottom: none;
  }

  .entry-num{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    padding-top: 4px;
  }

  .entry-title{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 22px;
    color: var(--ink);
    text-decoration: none;
    display: inline-block;
    margin-bottom: 6px;
    border-bottom: 1px solid transparent;
  }

  .entry-title:hover{
    border-bottom: 1px solid var(--accent);
    color: var(--accent);
  }

  .entry-title:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .entry-excerpt{
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 0 12px 0;
  }

  .entry-meta{
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .entry-meta .dot{
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }

  .empty-state{
    text-align: center;
    padding: 60px 20px;
  }

  .empty-state p{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  @media (max-width: 600px){
    :root{ --gutter: 40px; }
    .sheet{
      padding: 44px 24px 40px calc(var(--gutter) + 18px);
    }
    h1{ font-size: 27px; }
    .entry{ grid-template-columns: 28px 1fr; gap: 12px; }
    .entry-title{ font-size: 19px; }
  }
</style>
</head>
<body>

  <div class="sheet">
    <div class="margin-rule"></div>
    <div class="punch p1"></div>
    <div class="punch p2"></div>
    <div class="punch p3"></div>

    <div class="page-head">
      <div>
        <h1>All Entries</h1>
        <p class="subhead">Every post, in the order it was written.</p>
      </div>
      <a href="#" class="new-entry">+ New Entry</a>
    </div>

    <p class="index-count">10 entries</p>
    {% for blog in blogs %}
        <ul class="entries">

        <li class="entry">
            <span class="entry-num">01</span>
            <div>
            <a href="#" class="entry-title">{{blog.title}}</a>
            <p class="entry-excerpt">{{blog.content|truncatechars:50}}</p>
            <div class="entry-meta">
                <span>{{blog.author_id}}</span>
                <span class="dot"></span>
                <span>{{blog.created_at}}</span>
            </div>
            </div>
        </li>

        </ul>
    {% endfor %}
    <!--
      Empty state, shown instead of <ul class="entries"> when there are no posts:

      <div class="empty-state">
        <p>Nothing written yet — the first entry is waiting.</p>
      </div>
    -->

  </div>

</body>
</html>
